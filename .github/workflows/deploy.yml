name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3[cite: 19]

      - name: Setup Java
        uses: actions/setup-java@v3[cite: 19]
        with:
          distribution: 'zulu'[cite: 19]
          java-version: '17'[cite: 19]

      - name: Setup Flutter
        uses: subosito/flutter-action@v2[cite: 19]
        with:
          channel: 'stable'[cite: 19]

      - name: Install dependencies
        run: flutter pub get[cite: 19]

      - name: Clean build cache
        run: flutter clean

      - name: Build Web
        run: flutter build web --release --base-href "/my_calculator_app/"[cite: 19]

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3[cite: 19]
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}[cite: 19]
          publish_dir: ./build/web[cite: 19]